---
- name: Prepare host for Docker workloads
  hosts: app
  become: true
  gather_facts: true

  vars:
    deployer_public_key: "{{ lookup('env', 'DEPLOYER_SSH_PUBLIC_KEY') | default('', true) }}"

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-plugin
        state: present

    - name: Create deployer user
      ansible.builtin.user:
        name: deployer
        groups: docker
        append: true
        shell: /bin/bash
        create_home: true
        state: present

    - name: Grant passwordless sudo to deployer
      ansible.builtin.copy:
        dest: /etc/sudoers.d/deployer
        content: "deployer ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Add deployer SSH key when supplied
      ansible.posix.authorized_key:
        user: deployer
        key: "{{ deployer_public_key }}"
        state: present
      when: deployer_public_key | length > 0

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

